version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "julia"
    # "/" is the workspace root, which also covers test/ and docs/
    directories:
      - "/"
      - "/test/ad_and_reactant/ad"
      - "/test/ad_and_reactant/reactant"
      - "/test/ad_and_reactant/extensions/turing"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      julia-packages:
        patterns:
          - "*"
