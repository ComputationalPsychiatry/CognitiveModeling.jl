name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on pull requests
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
      id-token: write # lets codecov-action authenticate with OIDC
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        # Ubuntu for dev; all platforms for main and pull requests into main
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.base_ref == 'main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  separate_environments:
    name: Separate environment - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
      id-token: write # lets codecov-action authenticate with OIDC
    strategy:
      fail-fast: false
      matrix:
        # Each suite has its own environment. The Turing.jl extension's tests have one because Turing.jl holds
        # FlexiChains.jl at an older version than the main suite tests, and they run as the main suite does, with
        # bounds checks and coverage. Its automatic differentiation tests are in an environment of their own, in
        # test/ad_and_reactant beside those of the package itself.
        # The tutorials that the documentation's build runs are tested in its environment, docs, by a runner of their own.
        # Those that the build shows without running have an environment each, with the packages they use, and so do the
        # examples in docs/examples. They run with the argument fast, which runs the scripts whose test_tier in
        # docs/how_scripts_are_run.toml is fast; .github/workflows/LongTests.yml runs those whose tier is long.
        # The two suites of automatic differentiation test each group of backends in a job of its own, which the runner
        # selects by the arguments it is given: the backends whose names start with one of them. The Turing.jl extension's
        # suite runs its two parts, the tests of its features and the shared inference cases, in a job each
        include:
          - name: ad, ForwardDiff and ReverseDiff
            path: test/ad_and_reactant/ad
            arguments: ForwardDiff ReverseDiff
          - name: ad, Enzyme forward
            path: test/ad_and_reactant/ad
            arguments: '"Enzyme forward"'
          - name: ad, Enzyme reverse
            path: test/ad_and_reactant/ad
            arguments: '"Enzyme reverse"'
          - name: ad, Mooncake
            path: test/ad_and_reactant/ad
            arguments: Mooncake
          - name: reactant
            path: test/ad_and_reactant/reactant
          - name: turing, features
            path: test/extensions/turing
            arguments: features
            julia_flags: --check-bounds=yes --depwarn=yes --code-coverage=@
            coverage: true
          - name: turing, shared cases
            path: test/extensions/turing
            arguments: shared_cases
            julia_flags: --check-bounds=yes --depwarn=yes --code-coverage=@
            coverage: true
          - name: turing ad, ForwardDiff and ReverseDiff
            path: test/extensions/turing/ad
            arguments: ForwardDiff ReverseDiff
          - name: turing ad, Enzyme forward
            path: test/extensions/turing/ad
            arguments: '"Enzyme forward"'
          - name: turing ad, Enzyme reverse
            path: test/extensions/turing/ad
            arguments: '"Enzyme reverse"'
          - name: turing ad, Mooncake reverse
            path: test/extensions/turing/ad
            arguments: '"Mooncake reverse"'
          - name: turing ad, Mooncake forward
            path: test/extensions/turing/ad
            arguments: '"Mooncake forward"'
          - name: tutorials in the documentation's environment
            path: docs
            runner: test/documentation/tutorials/runtests.jl
            arguments: fast
          - name: reinforcement learning tutorial
            path: test/documentation/tutorials/interfacing_with_reinforcement_learning
            arguments: fast
          - name: pomdps tutorial
            path: test/documentation/tutorials/interfacing_with_pomdps
            arguments: fast
          - name: juliacontrol tutorial
            path: test/documentation/tutorials/interfacing_with_juliacontrol
            arguments: fast
          - name: sequential sampling models tutorial
            path: test/documentation/tutorials/interfacing_with_sequential_sampling_models
            arguments: fast
          - name: docs examples
            path: test/documentation/examples
            arguments: fast
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install the test environment
        run: julia --color=yes --project=${{ matrix.path }} -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests
        # The runner is runtests.jl in the environment's folder, unless the entry names another
        run: julia --color=yes ${{ matrix.julia_flags }} --project=${{ matrix.path }} ${{ matrix.runner || format('{0}/runtests.jl', matrix.path) }} ${{ matrix.arguments }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  # The premade models, a package of their own in PremadeCognitiveModels, which uses this commit of the core: its tests,
  # and its automatic differentiation and Reactant suites, each in its own environment
  premade:
    name: PremadeCognitiveModels - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reports whether this commit breaks the premade models, without failing the build
    continue-on-error: true
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - tests
          - ad
          - reactant
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Run the premade tests
        if: matrix.suite == 'tests'
        run: julia --color=yes --project=PremadeCognitiveModels -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Run the premade ${{ matrix.suite }} suite
        if: matrix.suite != 'tests'
        run: |
          julia --color=yes --project=PremadeCognitiveModels/test/ad_and_reactant/${{ matrix.suite }} -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=PremadeCognitiveModels/test/ad_and_reactant/${{ matrix.suite }} PremadeCognitiveModels/test/ad_and_reactant/${{ matrix.suite }}/runtests.jl
  # One check that says whether every test job passed, whatever the matrix holds, which the protection of main and dev
  # requires. The job of the premade models reports without blocking, so it isn't among them
  all_tests_passed:
    name: All tests passed
    if: always()
    needs: [test, separate_environments]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a test job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
