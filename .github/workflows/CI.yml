name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on pull requests
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
      id-token: write # lets codecov-action authenticate with OIDC
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        # Ubuntu for dev; all platforms for main and pull requests into main
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.base_ref == 'main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  separate_environments:
    name: Separate environment - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
      id-token: write # lets codecov-action authenticate with OIDC
    strategy:
      fail-fast: false
      matrix:
        # Each suite has its own environment. The Turing.jl extension's tests have one because Turing.jl holds
        # FlexiChains.jl at an older version than the main suite tests, and they run as the main suite does, with
        # bounds checks and coverage. Its automatic differentiation tests are in an environment of their own inside it.
        # The two tutorials that the documentation shows without running have one each, with the packages they use
        include:
          - name: ad
            path: test/ad_and_reactant/ad
          - name: reactant
            path: test/ad_and_reactant/reactant
          - name: turing
            path: test/extensions/turing
            julia_flags: --check-bounds=yes --depwarn=yes --code-coverage=@
            coverage: true
          - name: turing ad
            path: test/extensions/turing/ad
          - name: reinforcement learning tutorial
            path: test/tutorials/reinforcement_learning
          - name: pomdps tutorial
            path: test/tutorials/pomdps
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install the test environment
        run: julia --color=yes --project=${{ matrix.path }} -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests
        run: julia --color=yes ${{ matrix.julia_flags }} --project=${{ matrix.path }} ${{ matrix.path }}/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  premade:
    name: PremadeCognitiveModels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reports whether this commit breaks the premade models, without failing the build
    continue-on-error: true
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ComputationalPsychiatry/PremadeCognitiveModels.jl
          # main and pull requests into main use the premade package's main; everything else uses its dev
          ref: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'main' || 'dev' }}
          path: PremadeCognitiveModels.jl
      # The premade package expects this repo at ../CognitiveModeling.jl
      - run: mv PremadeCognitiveModels.jl ../PremadeCognitiveModels.jl
        shell: bash
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Run the premade tests against this commit
        run: julia --color=yes --project=../PremadeCognitiveModels.jl -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
