name: Format

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  juliaformatter:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      # Formats every Julia file with the style in .JuliaFormatter.toml, and fails if any changed
      - uses: julia-actions/julia-format@v4
        with:
          version: '2'
