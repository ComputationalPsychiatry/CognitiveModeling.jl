name: AD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on pull requests
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  ad:
    name: AD backends and Reactant
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete old caches
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install the test environment
        run: julia --color=yes --project=test/ad -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests
        run: julia --color=yes --project=test/ad test/ad/runtests.jl
